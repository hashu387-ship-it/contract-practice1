<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Practice &amp; Administration — Interactive Study Notes</title>
  <meta name="description" content="Complete, interactive, animated study notes for Contract Practice & Administration (MRICS & AIQS APC): FIDIC, claims, EOT, insurance, bonds, termination — with mind maps, flashcards, quizzes and explainer media." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6df0'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='serif' font-weight='700'%3E%C2%A7%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Reading progress bar -->
  <div id="progressBar" class="progress-bar"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">§</div>
      <div class="brand-text">
        <strong>Contract Practice</strong>
        <span>&amp; Administration</span>
      </div>
      <button id="sidebarClose" class="icon-btn only-mobile" aria-label="Close menu">✕</button>
    </div>

    <div class="search-box">
      <span class="search-ic">⌕</span>
      <input id="search" type="search" placeholder="Search notes, terms, tags…" autocomplete="off" />
      <kbd class="search-kbd">/</kbd>
    </div>
    <div id="searchResults" class="search-results" hidden></div>

    <nav id="nav" class="nav" aria-label="Course contents"></nav>

    <div class="sidebar-foot">
      <div class="courseauthor">
        <div class="ca-avatar">RdS</div>
        <div>
          <strong>Roshan de Silva</strong>
          <span>MRICS · MAIQS · LLM (Const. Law)</span>
        </div>
      </div>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn only-mobile" aria-label="Open menu">☰</button>
      <div class="tabs" id="tabs">
        <button class="tab is-active" data-view="notes">📖 Notes</button>
        <button class="tab" data-view="mindmap">🧠 Mind Maps</button>
        <button class="tab" data-view="flashcards">🃏 Flashcards</button>
        <button class="tab" data-view="quiz">✅ Quiz</button>
        <button class="tab" data-view="glossary">📚 Glossary</button>
      </div>
      <div class="topbar-right">
        <div id="readpct" class="readpct" title="Course progress">0%</div>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main id="content" class="content">
      <!-- Views injected by app.js -->
      <section id="view-notes" class="view is-active"></section>
      <section id="view-mindmap" class="view"></section>
      <section id="view-flashcards" class="view"></section>
      <section id="view-quiz" class="view"></section>
      <section id="view-glossary" class="view"></section>
    </main>
  </div>

  <button id="toTop" class="to-top" aria-label="Back to top">↑</button>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Close">✕</button>
    <figure><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></figure>
  </div>

  <!-- Data + app -->
  <script src="js/data.js"></script>
  <script src="js/content/part1.js"></script>
  <script src="js/content/part2.js"></script>
  <script src="js/content/part3.js"></script>
  <script src="js/content/part4.js"></script>
  <script src="js/content/part5.js"></script>
  <script src="js/content/glossary.js"></script>
  <script src="js/content/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
