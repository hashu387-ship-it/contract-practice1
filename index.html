<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RICS APC — Interactive Study Hub</title>
  <meta name="description" content="RICS & AIQS APC interactive study hub: Contract Practice & Administration and Procurement & Tendering — complete notes with explainer videos, mind maps, flashcards, quizzes and viva Q&A banks." />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232f6df0'/%3E%3Ctext x='50' y='74' font-size='64' text-anchor='middle' fill='white' font-family='cursive' font-weight='700'%3E%C2%A7%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Liquid-glass aurora background -->
  <div class="aurora" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>

  <div id="progressBar" class="progress-bar"></div>

  <!-- Top nav (no sidebar) -->
  <header class="topnav">
    <a class="brand" href="#top">
      <span class="brand-mark">§</span>
      <span class="brand-text"><strong>RICS APC</strong><span>Interactive Study Hub</span></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button class="tab is-active" data-view="notes">📖 Notes</button>
      <button class="tab" data-view="mindmap">🧠 Mind Maps</button>
      <button class="tab" data-view="flashcards">🃏 Flashcards</button>
      <button class="tab" data-view="quiz">✅ Quiz</button>
      <button class="tab" data-view="viva">🎤 Viva Q&amp;A</button>
      <button class="tab" data-view="glossary">📚 Glossary</button>
    </nav>
    <div class="nav-actions">
      <span id="readpct" class="readpct" title="Reading progress">0%</span>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- Subject switcher: each subject is one tab of the hub -->
  <div class="subjectbar" id="subjectbar">
    <button class="subject-pill is-active" data-subject="cpa">📜 Contract Practice &amp; Administration</button>
    <button class="subject-pill" data-subject="pt">🏗️ Procurement &amp; Tendering</button>
  </div>

  <a id="top"></a>
  <main id="content">
    <section id="view-notes" class="view is-active"></section>
    <section id="view-mindmap" class="view"></section>
    <section id="view-flashcards" class="view"></section>
    <section id="view-quiz" class="view"></section>
    <section id="view-viva" class="view"></section>
    <section id="view-glossary" class="view"></section>
  </main>

  <!-- Floating Contents (replaces sidebar) -->
  <button id="tocFab" class="toc-fab" aria-label="Open contents">✎ Contents</button>
  <div id="tocModal" class="toc-modal" aria-hidden="true">
    <div class="toc-scrim" data-toc-close></div>
    <div class="toc-panel glass">
      <button class="icon-btn toc-close" data-toc-close aria-label="Close">✕</button>
      <h3>Contents</h3>
      <div id="tocList"></div>
    </div>
  </div>

  <button id="toTop" class="to-top" aria-label="Back to top">↑</button>

  <div id="lightbox" class="lightbox" hidden>
    <button class="icon-btn lb-close" aria-label="Close">✕</button>
    <figure><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></figure>
  </div>

  <!-- Data + content -->
  <script src="js/data.js"></script>
  <script src="js/content/part1.js"></script>
  <script src="js/content/part2.js"></script>
  <script src="js/content/part3.js"></script>
  <script src="js/content/part4.js"></script>
  <script src="js/content/part5.js"></script>
  <script src="js/content/part6.js"></script>
  <script src="js/content/glossary.js"></script>
  <script src="js/content/quiz.js"></script>
  <script src="js/content/viva.js"></script>
  <script src="js/content/pt1.js"></script>
  <script src="js/content/pt2.js"></script>
  <script src="js/content/video-manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
